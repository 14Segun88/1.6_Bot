// ===============================================================
// CS 1.6 - AI Training Sandbox Runtime Config
// ===============================================================

// 1. Server settings & match flow
mp_timelimit 0
mp_roundtime 60
mp_freezetime 0
mp_buytime 99
mp_startmoney 16000
mp_buy_anywhere 1
mp_round_infinite 1
mp_autoteambalance 0
mp_limitteams 0
sv_cheats 1

// 2. Bot Engine (ZBot / CZ Bot)
bot_quota_mode fill
bot_quota 11
bot_join_team T
bot_join_after_player 0
bot_auto_vacate 0
bot_difficulty 0
bot_stop 1
bot_zombie 1
bot_chatter off
bot_prefix "[DUMMY]"

// 3. Visuals & Controls: Crosshair, HUD, Instant Weapon Switch
crosshair 1
cl_crosshairscale 0
cl_observercrosshair 1
hud_fastswitch 1
hud_draw 1

// 4. Auto-join player to CT
jointeam 2
wait
wait
joinclass 1

// 5. Explicitly add 11 dummy bots
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

// Emergency hotkeys:
bind "F1" "jointeam 2; wait; wait; joinclass 1"
bind "F2" "bot_add_t"
bind "F3" "bot_kill"
bind "F4" "bot_stop 1; bot_zombie 1"

echo "=== Sandbox Config Loaded: Dummies Frozen & Controls Active ==="
