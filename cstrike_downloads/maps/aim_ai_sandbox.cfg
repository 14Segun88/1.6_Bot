// ===============================================================
// AI Training Sandbox Config - Frozen Target Dummies
// ===============================================================
sv_cheats 1
mp_autoteambalance 0
mp_limitteams 0
mp_freezetime 0
mp_round_infinite 1
mp_roundtime 60
mp_startmoney 16000
mp_buy_anywhere 1

// Bot Engine: Completely freeze bots as static dummies
bot_stop 1
bot_freeze 1
bot_zombie 1
bot_difficulty 0
bot_knives_only 1
bot_chatter off
bot_join_team T
bot_quota_mode fill
bot_quota 11
bot_auto_vacate 0
bot_prefix "[DUMMY]"

// Visuals & Controls
crosshair 1
cl_crosshairscale 0
cl_observercrosshair 1
hud_fastswitch 1
hud_draw 1
cl_minmodels 1

// Hotkeys for in-game control:
bind "F1" "jointeam 2; wait; wait; joinclass 1"
bind "F2" "bot_add_t"
bind "F3" "bot_kill"
bind "F4" "bot_stop 1; bot_freeze 1; bot_zombie 1"

echo "=== AI Sandbox Config: Dummies 100% Frozen ==="
