// ===============================================================
// AI Training Sandbox Config - 11 Landmark Target Dummies
// ===============================================================
sv_cheats 1
mp_autoteambalance 0
mp_limitteams 0
mp_freezetime 0
mp_round_infinite 0
mp_round_restart_delay 1.55
mp_roundtime 1.92
mp_startmoney 16000
mp_buy_anywhere 1

// Bot Engine: 11 static target dummies on Team T
humans_join_team CT
bot_join_team T
bot_join_delay 0
bot_quota_mode normal
bot_quota 11
bot_stop 1
bot_freeze 1
bot_zombie 1
bot_difficulty 0
bot_knives_only 1
bot_chatter off
bot_auto_vacate 0
bot_prefix "[DUMMY]"

// Visuals & Controls
crosshair 1
cl_crosshairscale 0
cl_observercrosshair 1
hud_fastswitch 1
hud_draw 1
cl_minmodels 1

// Hotkeys for in-game control:
bind "F1" "autobuy"
bind "F2" "bot_quota 11"
bind "F3" "bot_kill"
bind "F4" "bot_stop 1; bot_freeze 1; bot_zombie 1"
bind "F5" "mp_roundtime 1.92; mp_round_restart_delay 1.55; sv_restart 1"
bind "F8" "menuselect 5; joinclass 5"

// Automatic instant spawn & class selection bindings
bind "1" "slot1; menuselect 1; joinclass 1"
bind "2" "slot2; menuselect 2; joinclass 2"
bind "3" "slot3; menuselect 3; joinclass 3"
bind "4" "slot4; menuselect 4; joinclass 4"
bind "5" "slot5; menuselect 5; joinclass 5"
setinfo _vgui_menus 0
cl_autowepswitch 1
hud_fastswitch 1

echo "=== AI Sandbox Config Loaded: 11 Tactical Dummies, 1:55 Round ==="
